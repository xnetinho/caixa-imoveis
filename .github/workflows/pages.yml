name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: {}
  # Pushes feitos pelos jobs com GITHUB_TOKEN (commits `data:`/`geo:`) NÃO
  # disparam workflows. Então o deploy é reexecutado ao término deles.
  workflow_run:
    workflows:
      - "Atualizar dados Caixa (CSV -> JSON + TOON)"
      - "Enriquecer geodata"
    types: [completed]
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ref: master garante o dataset mais recente mesmo quando disparado por
      # workflow_run (cujo github.sha é o SHA que INICIOU o workflow, não o
      # commit `data:`/`geo:` que ele acabou de fazer).
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/configure-pages@v5

      - name: Preparar artefato (só index.html + data/)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/ 2>/dev/null || true
          cp -r data _site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
