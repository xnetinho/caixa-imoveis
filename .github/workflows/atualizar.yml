name: Atualizar dados Caixa (CSV -> JSON + TOON)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '5 1 * * *'   # 22:05 BRT — Caixa publica o CSV ~22:00 BRT
                          # (last-modified 01:00:16 GMT medido em 10/10/2026)

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # MODO GERAL (padrão): baixa 1 único CSV (Lista_imoveis_geral.csv,
      # Brasil inteiro, ~7.7MB), divide por UF e grava
      # data/{UF}/imoveis.{csv,json,toon}. 1 chamada ao servidor da Caixa
      # em vez de 27 — elimina o bloqueio Radware de requisições em
      # sequência do mesmo IP (verificado: 1ª passa, demais 302).
      # Fallback: se o CSV geral falhar, downloads por UF no mesmo job.
      - name: Baixar, dividir por UF e converter
        run: |
          if python3 scripts/pipeline.py geral; then
            echo "MODO=geral" >> $GITHUB_ENV
          else
            echo "CSV geral falhou — fallback: downloads por UF"
            python3 scripts/pipeline.py || exit 1
            echo "MODO=ufs" >> $GITHUB_ENV
          fi

      - name: Resumo
        run: |
          python3 - <<'EOF'
          import json
          s = json.load(open('data/_status.json'))
          print(f"Modo: {s.get('modo')} | OK: {s['ufs_ok']} | Falha: {s['ufs_falha']} | Executado: {s['executado_em']}")
          for uf, st in sorted(s['status'].items()):
              if st.get('ok'):
                  print(f"  {uf}: {st.get('total', st.get('gerado_em'))}")
              else:
                  print(f"  {uf}: {st.get('erro', 'FALHOU')}")
          EOF

      - name: Commit se houver mudanças
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add -A data/
            git commit -m "data: atualização $(date -u +%Y-%m-%d) [$MODE] — $(python3 -c "import json; s=json.load(open('data/_status.json')); print(f\"{s['ufs_ok']} UFs OK, {s['ufs_falha']} falha\")")"
            git push
          else
            echo "Nenhuma mudança de conteúdo — sem commit."
          fi