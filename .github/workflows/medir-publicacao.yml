name: Medir horário de publicação do CSV da Caixa

# Roda 6x/dia em horários espalhados e registra a "Data de geração" de 3 UFs
# sonda num histórico commitado. Depois de ~2 dias sabemos exatamente em que
# janela a Caixa publica o CSV novo -> ajustamos o cron do atualizar.yml.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '5 1,5,9,13,17,21 * * *'   # a cada 4h: 22:05, 02:05, 06:05, 10:05, 14:05, 18:05 BRT

permissions:
  contents: write

concurrency:
  group: medir-publicacao
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Sondar data de geração (PB, SP, BA)
        run: |
          mkdir -p docs
          for uf in PB SP BA; do
            code=$(curl -sS -o raw.csv -w '%{http_code}' --max-time 90 \
              "https://venda-imoveis.caixa.gov.br/listaweb/Lista_imoveis_${uf}.csv" || echo ERR)
            if [ "$code" = "200" ] && grep -qa "Lista de Im" raw.csv; then
              # extrai "Data de geração:;DD/MM/AAAA" (cp1252)
              dg=$(iconv -f WINDOWS-1252 -t UTF-8 raw.csv 2>/dev/null \
                   | grep -oP 'Data de geração:;\K[0-9]{2}/[0-9]{2}/[0-9]{4}' | head -1)
              echo "$(date -u '+%Y-%m-%d %H:%M UTC'),$uf,$dg,$(stat -c%s raw.csv)" >> docs/publicacao.csv
              echo "$uf -> gerado em $dg ($code, $(stat -c%s raw.csv) bytes)"
            else
              echo "$(date -u '+%Y-%m-%d %H:%M UTC'),$uf,BLOQUEADO($code),0" >> docs/publicacao.csv
              echo "$uf -> BLOQUEADO ($code)"
            fi
            sleep 3
          done
          sort -u docs/publicacao.csv -o docs/publicacao.csv

      - name: Commit histórico
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/)" ]; then
            git add docs/publicacao.csv
            git commit -m "medicao: horario de publicacao do CSV da Caixa $(date -u +%Y-%m-%d' '%H:%M)"
            git push
          fi